[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zkqec"
version = "0.0.1"
description = "Evidence-gated multi-agent zero-knowledge QEC code-discovery workflow"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "pydantic==2.13.4", "networkx==3.4.2",
                "pynauty==2.8.8.1", "zstandard", "jsonschema"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
qec = ["stim==1.16.0", "ldpc==2.4.1", "pymatching==2.4.0"]

[project.scripts]
zkqec = "zkqec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
markers = ["optional: requires an optional QEC backend", "slow: bounded exhaustive reference checks",
           "live: calls a hosted model (never run by default)"]
